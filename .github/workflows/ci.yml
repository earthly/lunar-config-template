name: Sync Lunar Config
on:
  push:
    branches:
      - main
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read hub host from config
      id: config
      run: |
        hub_host=$(grep -A1 '^hub:' lunar-config.yml | grep 'host:' | awk '{print $2}')
        echo "hub_host=$hub_host" >> $GITHUB_OUTPUT
    - name: Sync Lunar config
      uses: earthly/lunar-actions/sync-config@main
      with:
        lunar-version: v1.0.11
        manifest-url: github://${{ github.repository }}@main
        hub-token: ${{ secrets.LUNAR_HUB_TOKEN }}
        hub-host: ${{ steps.config.outputs.hub_host }}
